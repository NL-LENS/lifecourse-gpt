# Partially generated and refined with Claude Code (Opus 5).
# Pretrains a Delphi life-course model on the synthetic silver layer written by
#   python -m litgpt.life_events.dummy_data --out_dir data/dummy_life_events
# Run it with
#   litgpt pretrain --config config_hub/pretrain/delphi-2m.yaml
# See README.md for the data format and for training on your own datasets.

# Delphi's architecture, from `litgpt.config`. It is spelled out under ``model_config``
# rather than named here because ``model_config`` replaces a named config wholesale, and
# the vocabulary has to match the data (13 dummy event types plus <pad> and <no_event>).
model_name: delphi-2m

model_config:
  name: delphi-2m
  # Selects `litgpt.life_events.delphi.model.Delphi`, which adds the age encoding to
  # `GPT` and trains under the competing-risks likelihood instead of cross entropy.
  model_class_name: Delphi
  # Longest event sequence the model sees, no-event tokens included.
  block_size: 48
  # Both equal to the data module's `vocab_size`. Padding entries are not free here:
  # every unused entry still contributes exp(logit) to the total event rate.
  vocab_size: 15
  padded_vocab_size: 15
  n_layer: 12
  n_head: 12
  n_embd: 120
  intermediate_size: 480
  parallel_residual: false
  bias: true
  norm_class_name: LayerNorm
  mlp_class_name: GptNeoxMLP
  # No RoPE: the age encoding is meant to be the only ordering signal, so that the model
  # cannot fit an event's index in the sequence instead of the age it happened at.
  rotary_percentage: 0.0
  # Floor on the expected waiting time, in days. 0.0 disables it.
  t_min: 0.0
  # Dropout over whole event embeddings, applied before the age encoding is added.
  token_dropout: 0.0

out_dir: out/pretrain/delphi-2m

# "32-true" because this is small enough to be worth running on CPU. Use "bf16-mixed" on
# a GPU; ages are promoted to float32 inside the loss either way.
precision: 32-true

resume: false

data:
  class_path: DelphiLifeEvents
  init_args:
    event_paths:
      - data/dummy_life_events/work_education.parquet
      - data/dummy_life_events/civil_registry.parquet
    person_path: data/dummy_life_events/persons.parquet
    # Preprocessed sequences land here. Delete the directory to force a rebuild.
    cache_dir: data/dummy_life_events/cache
    # Fraction of individuals held out, never a fraction of rows.
    val_split_fraction: 0.05
    # Delphi's no-event tokens: one every `no_event_rate` years of the observed window.
    no_event_mode: regular
    no_event_rate: 5.0
    num_workers: 2
    # Attributes read out of NOTES and carried into the batch as `note_<name>`. Delphi
    # ignores them; uncomment to give a new architecture something to consume.
    # notes_fields:
    #   income: {field: income, dtype: DOUBLE, fill: 0.0}

train:
  save_interval: 1000
  log_interval: 50
  global_batch_size: 64
  micro_batch_size: 16
  lr_warmup_steps: 100
  epochs:
  max_tokens: 2000000
  max_steps:
  max_seq_length:
  tie_embeddings:
  max_norm: 1.0
  min_lr: 6e-5

eval:
  interval: 500
  max_new_tokens:
  max_iters: 20
  initial_validation: false
  final_validation: true

optimizer:
  class_path: torch.optim.AdamW
  init_args:
    lr: 6e-4
    weight_decay: 0.1
    betas:
      - 0.9
      - 0.95

devices: auto
num_nodes: 1

# "csv" keeps this runnable without tensorboard installed.
logger_name: csv

seed: 42
