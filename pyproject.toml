[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools>=68.2.2",
  "wheel>=0.41.2",
]

[project]
name = "litgpt"
version = "0.5.13"
description = "GPT-style sequence models for life-course event data"
readme = "README.md"
license = { file = "LICENSE.md" }
authors = [
  { name = "Netherlands eScience Center" },
  { name = "ODISSEI" },
]
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "jsonargparse[signatures]>=4.37,<=4.41",
  "lightning>=2.6.1",
  "numpy",
  "torch>=2.7",
  # litgpt.pretrain:
  "torchmetrics>=1.3.1",
]
optional-dependencies.extra = [
  # litgpt.life_events.data:
  "duckdb>=1.0",
  # litgpt.life_events.data, litgpt.life_events.dummy_data:
  "pyarrow>=15.0.2",
  # litgpt.pretrain logger_name="tensorboard":
  "tensorboard>=2.14",
]
optional-dependencies.test = [
  # litgpt.life_events.data:
  "duckdb>=1.0",
  "pyarrow>=15.0.2",
  "pytest>=8.1.1",
  "pytest-rerunfailures>=14",
  "pytest-timeout>=2.3.1",
]
urls.homepage = "https://github.com/NL-LENS/lifecourse-gpt"
scripts.litgpt = "litgpt.__main__:main"

[tool.setuptools]
package-data.litgpt = [
  "LICENSE.md",
  "README.md",
]
packages.find.include = [
  "litgpt",
  "litgpt.*",
]
packages.find.exclude = []

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = [
  "build",
  "dist",
  "docs",
]
lint.select = [
  "E",
  "F",  # see: https://pypi.org/project/pyflakes
  "I",  # implementation for isort
  "UP", # see: https://docs.astral.sh/ruff/rules/#pyupgrade-up
  "W",  # see: https://pypi.org/project/pycodestyle
]
# extend-select = [
#    "C4",  # see: https://pypi.org/project/flake8-comprehensions
#    "PT",  # see: https://pypi.org/project/flake8-pytest-style
#    "RET",  # see: https://pypi.org/project/flake8-return
#    "SIM",  # see: https://pypi.org/project/flake8-simplify
# ]
lint.ignore = [
  "E501", # Line too long
  "E731", # Do not assign a lambda expression, use a def
  "E741", # todo: Ambiguous variable name
  "F841", # todo: Local variable is assigned to but never used
]
# Use Google-style docstrings.
lint.pydocstyle.convention = "google"

[tool.codespell]
# skip = '*.py'
quiet-level = 3

[tool.pytest]
ini_options.addopts = [
  "--strict-markers",
  # "--doctest-modules",
  "--color=yes",
  "--disable-pytest-warnings",
]
